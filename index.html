<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幻想宴会ドラフト</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lobby">
  <div class="lobby-card">
    <h1>幻想宴会ドラフト</h1>
    <p class="subtitle">東方Project二次創作 × スシGO風ドラフト</p>
    <p class="note">プロトタイプ v0.3（異変パックシステム）— ホットシート / オンライン対戦（2〜5人）</p>
    <input id="input-name" placeholder="幹事の名前" value="貴殿" maxlength="12">

    <div id="mode-select">
      <button id="btn-mode-solo" class="secondary">ひとりで遊ぶ（AI3人）</button>
      <button id="btn-mode-online" class="secondary">みんなで遊ぶ（ルーム）</button>
    </div>

    <div id="solo-panel" class="hidden">
      <label class="setting-row">異変
        <select id="solo-incident"></select>
      </label>
      <button id="btn-start">宴会を始める</button>
      <div><button id="btn-solo-back" class="secondary back-btn">← 戻る</button></div>
    </div>

    <div id="mp-entry" class="hidden">
      <button id="btn-create" class="secondary">ルームを作る</button>
      <input id="input-code" placeholder="コード" maxlength="4" autocomplete="off">
      <button id="btn-join" class="secondary">参加する</button>
      <div><button id="btn-mp-back" class="secondary back-btn">← 戻る</button></div>
    </div>

    <div id="online-lobby" class="hidden">
      <p class="note">ルームコード: <strong id="online-code"></strong>（参加者に伝えてください）</p>
      <div id="online-settings">
        <label class="setting-row">異変
          <select id="setting-incident"></select>
        </label>
        <label class="setting-row">取得時間
          <select id="setting-timer">
            <option value="30">30秒</option>
            <option value="60">60秒</option>
            <option value="0">無制限</option>
          </select>
        </label>
        <p class="note" id="setting-hint">※ルームマスターのみ変更できます</p>
      </div>
      <div id="online-players"></div>
      <button id="btn-online-start" class="hidden">ゲーム開始</button>
      <p class="note" id="online-hint"></p>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>幻想宴会ドラフト</h1>
    <div id="round-indicator"></div>
    <div id="pass-indicator"></div>
    <div id="timer-indicator" class="hidden"></div>
    <button id="btn-cardref" class="secondary btn-cardref">異変カード一覧</button>
  </header>

  <main>
    <section id="board">
      <div id="player-bar"></div>

      <div id="hand-area">
        <div id="hand-status"></div>
        <div id="hand-buttons">
          <button id="btn-chopsticks" class="hidden">早飲みモードに切り替え（2枚取る）</button>
          <button id="btn-confirm-pick" class="hidden">このカードを取る</button>
        </div>
        <div id="hand"></div>
      </div>

      <div id="table-rows"></div>
    </section>

    <div id="select-area"></div>

    <aside id="side">
      <h3>ログ</h3>
      <div id="log"></div>
    </aside>
  </main>

  <div id="banner" class="hidden"></div>
  <div id="cardref" class="hidden"></div>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
<script src="net.js"></script>
</body>
</html>
